let AC=null, sfxOff=store.get("fa-sfx")==="0", musicOff=store.get("fa-music")==="0";
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,{type="triangle",vol=.18,to=null}={}){
  const c=ac();if(!c||sfxOff)return;const s=c.currentTime+t,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,s);if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.015);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.02)}
const SFX={
  tap:()=>tone(660,0,.06,{type:"sine",vol:.12}),
  right:()=>{tone(784,0,.12);tone(1175,.09,.22)},
  trap:()=>{tone(784,0,.1);tone(988,.08,.1);tone(1319,.16,.28)},
  wrong:()=>{tone(392,0,.28,{type:"square",vol:.07,to:370});tone(311,.3,.5,{type:"square",vol:.07,to:262})},
  tick:()=>tone(1500,0,.03,{type:"sine",vol:.06}),
  level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.2)),
  end:()=>[784,659,523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24))
};

/* musette waltz loop: accordion-ish voice, 16 bars in 3/4 */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[[76,74,72],[76,79,79],[77,76,74],[74,0,71],[74,77,77],[76,74,71],[72,76,79],[84,0,0],
           [81,79,77],[77,76,77],[79,76,72],[76,0,76],[74,77,76],[74,71,74],[72,0,67],[72,0,0]];
const CH={C:[[48],[60,64,67]],G:[[43],[59,62,65]],F:[[41],[60,65,69]]};
const PROG="CCGGGGCCFFCCGGCC";
const BEAT=60/120;
const M={on:false,gain:null,next:0,step:0,timer:null};
function voice(f,t,d,vol,dest){
  const c=AC,lp=c.createBiquadFilter(),g=c.createGain();lp.type="lowpass";lp.frequency.value=900;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  [["sine",0],["triangle",4]].forEach(([ty,cents])=>{const o=c.createOscillator();o.type=ty;o.frequency.value=f;o.detune.value=cents;o.connect(lp);o.start(t);o.stop(t+d+.05)});
  lp.connect(g).connect(dest)}
function schedule(){
  if(!M.on)return;
  while(M.next<AC.currentTime+.25){
    const bar=(M.step/3|0)%16, b=M.step%3, t=M.next, ch=CH[PROG[bar]], n=MEL[bar][b];
    if(n)voice(mtof(n-12),t,BEAT*1.1,.035,M.gain);
    if(b===0)voice(mtof(ch[0][0]),t,BEAT*1.2,.045,M.gain);
    else ch[1].forEach(x=>voice(mtof(x-12),t,BEAT*.5,.012,M.gain));
    M.next+=BEAT;M.step=(M.step+1)%48;
  }
}
function startMusic(){
  const c=ac();if(!c||musicOff||M.on)return;
  M.on=true;M.gain=c.createGain();M.gain.gain.setValueAtTime(0,c.currentTime);M.gain.gain.linearRampToValueAtTime(.8,c.currentTime+2.5);
  M.gain.connect(c.destination);M.next=c.currentTime+.1;M.step=0;M.timer=setInterval(schedule,60);schedule();
}
function stopMusic(){
  if(!M.on)return;M.on=false;clearInterval(M.timer);const g=M.gain,c=AC;
  g.gain.cancelScheduledValues(c.currentTime);g.gain.setValueAtTime(g.gain.value,c.currentTime);g.gain.linearRampToValueAtTime(0,c.currentTime+.4);
  setTimeout(()=>g.disconnect(),600);
}

  document.querySelectorAll(".musbtn").forEach(b=>{b.classList.toggle("off",musicOff);b.setAttribute("aria-label","Music "+(musicOff?"off":"on"))});
}

function start(){
  S={lvl:0,hearts:3,streak:0,best:0,score:0,betrayed:[],hits:[]};
  startMusic();
  levelIntro();
}

function levelIntro(){
  setTall(false);
  const L=LEVELS[S.lvl];
  S.deck=S.lvl===0?[L.pool[0],...shuffle(L.pool.slice(1)).slice(0,L.n-1)]:shuffle(L.pool).slice(0,L.n);
  S.i=0;S.marks=[];S.opts=null;S.locked=true;
  app.innerHTML=`<div class="screen center lvl-intro"><div class="lvl-block">
    <div class="eyebrow">Niveau ${S.lvl+1} sur 3</div>
    <div class="lvlname">${L.name}</div>
    <div class="lvlsub">${L.sub}</div></div>
    <button class="big shine" id="go">C'est parti</button></div>`;
  $("#go").onclick=()=>{SFX.tap();play()};
  $("#go").focus();SFX.level();
}

function hud(breakIdx=-1){
  const L=LEVELS[S.lvl];
  return `<div class="hud"><div class="hud-l"><button class="icon" id="quit" aria-label="Exit game">✕</button>${iconBtns()}</div>
    <div class="hearts">${[0,1,2].map(i=>`<span class="heart ${i===breakIdx?'breaking':i>=S.hearts?'lost':''}">❤️</span>`).join("")}</div>
    <div class="streak" id="streak">🔥 ${S.streak}</div></div>
    <div class="sub-hud"><div class="lvl">${L.name}</div>
    <div class="progress">${S.deck.map((_,i)=>`<i class="${S.marks[i]||''}"></i>`).join("")}</div></div>`;
}

function play(){
  setTall(false);
  const c=S.deck[S.i], L=LEVELS[S.lvl];
  S.opts=shuffle([{t:c.a[0],e:c.a[1],ok:1},{t:c.b[0],e:c.b[1],ok:0}]);
  S.locked=false;S.ready=false;S.anim=null;
  app.innerHTML=`${hud()}
   <div class="stage"><div class="card-wrap"><div class="card enter" id="card">
     <div class="face front"><div class="stripe"><b style="background:var(--bleu)"></b><b style="background:#fff"></b><b style="background:var(--rouge)"></b></div>
       <div class="tag">Ce mot veut dire…</div><div class="word">${c.w}</div><div class="q">What does it mean?</div>
       <svg class="ring" id="ring"><rect class="track"/><rect class="fuse" id="fuse" pathLength="100" stroke-dasharray="100 100"/></svg></div>
     <div class="face back" id="back"></div></div><div class="hold" id="hold"></div></div></div>
   <div class="opts">${S.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="e">${o.e}</span><span class="t">${o.t}</span></button>`).join("")}</div>
`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  fit(app.querySelector(".front .word"),56,26);
  const cardEl=$("#card");
  cardEl.addEventListener("pointerdown",holdOn);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>cardEl.addEventListener(ev,holdOff));
  cardEl.addEventListener("contextmenu",e=>e.preventDefault());
  const ring=$("#ring"), front=ring.parentElement, W=front.offsetWidth, H=front.offsetHeight;
  ring.setAttribute("viewBox",`0 0 ${W} ${H}`);
  ring.querySelectorAll("rect").forEach(r=>{r.setAttribute("x",1.5);r.setAttribute("y",1.5);r.setAttribute("width",W-3);r.setAttribute("height",H-3);r.setAttribute("rx",26.5)});
  const fuse=$("#fuse");
  S.anim=fuse.animate([{strokeDashoffset:0},{strokeDashoffset:-100}],{duration:L.time,easing:"linear",fill:"forwards"});
  S.late=setTimeout(()=>startLate(fuse),L.time*.65);
  S.timer=setTimeout(()=>answer(-1),L.time);
}
function fit(el,max,min){if(!el)return;let z=max;el.style.fontSize=z+"px";
  while(el.scrollWidth>el.clientWidth+1&&z>min){z-=2;el.style.fontSize=z+"px"}}
function startLate(fuse){fuse.classList.add("late");SFX.tick();S.tickI=setInterval(SFX.tick,500)}
function stopClock(){clearTimeout(S.timer);clearTimeout(S.late);clearInterval(S.tickI)}

function revealHTML(c,ok,timeout){
  const verdict=ok?"Oui !":(timeout?"Too slow":"Betrayed");
  return `<div class="rv-tag">${verdict}</div>
    <div class="rv-mid"><div class="rv-emo">${c.a[1]}</div>
      <div class="rv-word">${c.w}</div>
      <div class="rv-eq">= ${c.a[0]}</div>
      ${c.trap?`<div class="rv-not">not <span class="strike">${c.b[0]}</span></div>`:""}</div>
    <div class="note">${c.line}</div>`;
}

function answer(i){
  if(!S||S.locked||S.paused)return;S.locked=true;stopClock();
  if(S.anim)S.anim.pause();
  const c=S.deck[S.i], ok=i>=0&&S.opts[i].ok;
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;
    if(S.opts[k].ok)b.classList.add("right");else if(k===i)b.classList.add("wrong");else b.classList.add("dim")});
  const back=$("#back"), card=$("#card");
  back.className="face back "+(ok?"good":"bad");
  back.innerHTML=revealHTML(c,ok,i<0);
  fit(back.querySelector(".rv-word"),38,22);
  let broke=-1;
  if(ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak);S.marks[S.i]="done";S.hits.push(c);confetti(card);(c.trap?SFX.trap:SFX.right)()}
  else{S.streak=0;S.hearts--;broke=S.hearts;S.marks[S.i]="miss";S.betrayed.push(c);SFX.wrong()}
  const t=document.createElement("div");t.innerHTML=hud(broke);
  app.querySelector(".hud").replaceWith(t.children[0]);app.querySelector(".sub-hud").replaceWith(t.children[0]);
  if(ok)$("#streak").classList.add("pop");
  card.classList.remove("enter");
  const delay=ok?0:400;
  if(!ok)card.classList.add("shake");
  setTimeout(()=>{card.classList.remove("shake");if(!ok)card.classList.add("slow");card.classList.add("flipped")},delay);
  setTimeout(()=>{S.ready=true;card.classList.add("ready");
    $("#hold").textContent="Hold the card to keep reading";autoNext(ok?1900:2700)},delay+500);
}

function autoNext(ms){clearTimeout(S.adv);S.adv=setTimeout(()=>{if(S&&S.ready&&!S.held)next()},ms)}
function holdOn(){if(!S||!S.ready)return;S.held=true;clearTimeout(S.adv);$("#card").classList.add("held")}
function holdOff(){if(!S||!S.held)return;S.held=false;const c=$("#card");c&&c.classList.remove("held");autoNext(900)}

function next(){
  if(!S||S.done)return;
  if(S.paused){S.pending=true;return}
  S.ready=false;S.held=false;clearTimeout(S.adv);
  if(S.hearts<=0)return end();
  S.i++;
  if(S.i>=S.deck.length){S.lvl++;if(S.lvl>=LEVELS.length)return end();return levelIntro()}
  play();
}

function confetti(el){
  const r=el.getBoundingClientRect(), bits=["✨","🥐","⭐","💙"];
  for(let k=0;k<8;k++){const s=document.createElement("span");s.className="fly";s.textContent=bits[k%4];
    s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height/3)+"px";
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");s.style.setProperty("--dy",(Math.random()*-160-40)+"px");
    s.style.setProperty("--r",(Math.random()*180-90)+"deg");document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
}

function result(){
  const note=Math.round(S.score/TOTAL*20);
  const rank=RANKS.find(r=>note<=r.max);
  return {note,rank};
}

function end(){
  S.done=true;S.opts=null;setTall(true);
  const {note,rank}=result();
  const miss=S.betrayed, list=miss.length?miss:S.hits;
  app.innerHTML=`<div class="screen end">
    <div class="hud"><div class="hud-l"><button class="icon" id="home" aria-label="Back to start">⌂</button></div><div class="hud-l">${iconBtns()}</div></div>

    <div class="hint" id="hint"></div>
    <section class="rev"><h2>${miss.length?"Remember these":"You got all of these"}</h2>
      <div class="pairs">${list.map(c=>`<div class="pair ${miss.length?'':'ok'}"><b>${c.w}</b><span>= ${c.a[0]}</span><i>${c.a[1]}</i></div>`).join("")}</div>
    </section>

  </div>`;

  $("#again").onclick=()=>{SFX.tap();start()};

function copyImage(){
  const h=$("#hint");
  if(!S||!S.canvas){h.textContent="Still drawing your bulletin. Try again in a second.";return}
  try{
    const blob=new Promise(r=>S.canvas.toBlob(r,"image/png"));
    navigator.clipboard.write([new ClipboardItem({"image/png":blob})])
      .then(()=>{h.textContent="Copied. Paste it anywhere.";h.classList.add("ok")})
      .catch(()=>{h.textContent="Copying isn't allowed here. Long-press or right-click the image to save it.";h.classList.remove("ok")});
  }catch(e){h.textContent="Copying isn't allowed here. Long-press or right-click the image to save it."}
}

function rr(x,ctx,X,Y,W,H,R){ctx.beginPath();ctx.moveTo(X+R,Y);ctx.arcTo(X+W,Y,X+W,Y+H,R);ctx.arcTo(X+W,Y+H,X,Y+H,R);ctx.arcTo(X,Y+H,X,Y,R);ctx.arcTo(X,Y,X+W,Y,R);ctx.closePath()}
async function drawBulletin(note,rank){

  x.strokeStyle="#FFB8C0";x.lineWidth=3;x.beginPath();x.moveTo(112,36);x.lineTo(112,1304);x.stroke();x.restore();
  const pill=(X,Y,txt,fill)=>{x.font=F(700,30,"Nunito");const w=x.measureText(txt).width+48;
    rr(0,x,X,Y+6,w,60,30);x.fillStyle=C.ink;x.fill();rr(0,x,X,Y,w,60,30);x.fillStyle=fill;x.fill();x.lineWidth=4;x.strokeStyle=C.ink;x.stroke();
    x.fillStyle=C.ink;x.textAlign="left";x.fillText(txt,X+24,Y+41);return w};

  x.fillStyle=C.soft;x.font=F(800,26,"Nunito");x.letterSpacing="5px";x.fillText("BULLETIN SCOLAIRE",140,178);x.letterSpacing="0px";

  x.textAlign="center";const [s1,s2]=rank.stamp;const sz=l=>Math.min(44,Math.floor(212/(l*.62)));

  if(S.best>=3)pill(140,1096,`🔥 Best streak ${S.best}`,C.paper);
  // footer
  x.textAlign="center";x.fillStyle=C.soft;x.font=F(700,26,"Nunito");x.fillText("faux-ami-french-game.vercel.app",540,1262);
  return cv;
}

/* ---------- exit / pause ---------- */
function openExit(){
  if(!S||S.paused||S.done||document.querySelector(".modal"))return;
  S.paused=true;
  const L=LEVELS[S.lvl], running=!S.locked&&S.anim;
  if(running){S.anim.pause();stopClock();S.left=L.time-S.anim.currentTime}
  clearTimeout(S.adv);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="sheet"><h2>Leave the game?</h2><p>This run won't be saved.</p>
    <div class="row"><button class="big sm alt" id="stay">Keep playing</button><button class="big sm" id="leave">Exit</button></div></div>`;
  document.body.appendChild(m);$("#stay").focus();
  const close=()=>{m.remove();S.paused=false;if(S.pending&&!S.done){S.pending=false;next()}};
  $("#stay").onclick=()=>{close();if(S.ready)autoNext(1500);
    if(running){const fuse=$("#fuse");S.anim.play();
      S.late=setTimeout(()=>fuse&&startLate(fuse),Math.max(0,S.left-L.time*.35));
      S.timer=setTimeout(()=>answer(-1),S.left)}};
  $("#leave").onclick=()=>{S.done=true;m.remove();S=null;title()};
  m.onclick=e=>{if(e.target===m)$("#stay").click()};
}

document.addEventListener("click",e=>{
  if(e.target.closest("#quit"))openExit();
  else if(e.target.closest(".sfxbtn")){sfxOff=!sfxOff;store.set("fa-sfx",sfxOff?"0":"1");syncIcons();SFX.tap()}
  else if(e.target.closest(".musbtn")){musicOff=!musicOff;store.set("fa-music",musicOff?"0":"1");syncIcons();musicOff?stopMusic():startMusic()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){const s=$("#stay");if(s)s.click();else if($("#quit"))openExit();return}
  if(!S||S.paused)return;
  if(S.ready&&(e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){e.preventDefault();if(e.repeat)return;next();return}
  if(!S.opts||S.locked)return;
  if(e.key==="ArrowLeft"||e.key==="1")answer(0);
  if(e.key==="ArrowRight"||e.key==="2")answer(1);
});
title();
</script>
